name: Pull Request Validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  create_checks:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    outputs:
      check_run_ids: ${{ steps.create.outputs.check_run_ids }}

    steps:
      - name: Resolve head and merge SHAs
        id: resolve_sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number || '' }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha || '' }}"

          if [ -n "$PR_NUMBER" ]; then
            for i in $(seq 1 10); do
              PR_JSON=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API/pulls/$PR_NUMBER")

              API_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha // empty')
              API_MERGE_SHA=$(echo "$PR_JSON" | jq -r '.merge_commit_sha')

              if [ -n "$API_HEAD_SHA" ]; then
                HEAD_SHA="$API_HEAD_SHA"
              fi

              if [ -n "$API_MERGE_SHA" ] && [ "$API_MERGE_SHA" != "null" ]; then
                MERGE_SHA="$API_MERGE_SHA"
                break
              fi

              MERGE_SHA=""
              sleep 3
            done
          fi

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$MERGE_SHA" ] && [ "$MERGE_SHA" != "null" ] && [ "$MERGE_SHA" != "$HEAD_SHA" ]; then
            echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "merge_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create E2E checks (in progress)
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.resolve_sha.outputs.head_sha }}
          MERGE_SHA: ${{ steps.resolve_sha.outputs.merge_sha }}
        run: |
          set -euo pipefail
          CHECK_NAME="E2E (Internal & Prod)"
          API="https://api.github.com/repos/${{ github.repository }}"
          IDS=""

          for SHA in "$HEAD_SHA" $MERGE_SHA; do
            [ -z "$SHA" ] && continue
            RESPONSE=$(curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$API/check-runs" \
              -d "{\"name\":\"$CHECK_NAME\",\"head_sha\":\"$SHA\",\"status\":\"in_progress\"}")
            CHECK_ID=$(echo "$RESPONSE" | jq -r '.id')
            if [ -z "$CHECK_ID" ] || [ "$CHECK_ID" = "null" ]; then
              echo "Create failed on $SHA: $RESPONSE"
              exit 1
            fi
            echo "Created check $CHECK_ID on $SHA"
            IDS="${IDS}${IDS:+,}$CHECK_ID"
          done

          echo "check_run_ids=$IDS" >> "$GITHUB_OUTPUT"

  validation:
    uses: ./.github/workflows/mock-snyk-scan.yml

  comment-context:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.comment-check.outputs.should_run }}
    steps:
      - name: Determine whether E2E should run
        id: comment-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          PR_URL: ${{ github.event.issue.pull_request.url || '' }}
          ENABLE_E2E_COMMENT_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION || '' }}
        run: |
          set -euo pipefail

          if [ "$ENABLE_E2E_COMMENT_VALIDATION" != "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$PR_URL" ] && echo "$COMMENT_BODY" | grep -qiE '^/(runtests|runchecks)\b'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # E2E test jobs (Fixed Conditional Execution)
  # ------------------------------------------------------------------
  e2e-internal:
    name: E2E Tests (Internal)
    needs: [validation, comment-context]
    # FIX: Safely verifies comment-context ran successfully before evaluating its outputs
    if: |
      always() &&
      needs.comment-context.result == 'success' && 
      (vars.ENABLE_E2E_COMMENT_VALIDATION != 'true' || github.event_name == 'issue_comment') &&
      needs.comment-context.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mock internal E2E run completed
        run: sleep 1m && echo "Mock internal E2E run completed"

  e2e-prod:
    name: E2E Tests (Prod)
    needs: [validation, comment-context]
    # FIX: Safely verifies comment-context ran successfully before evaluating its outputs
    if: |
      always() &&
      needs.comment-context.result == 'success' && 
      (vars.ENABLE_E2E_COMMENT_VALIDATION != 'true' || github.event_name == 'issue_comment') &&
      needs.comment-context.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mock Prod E2E run completed
        run: echo "Mock Prod E2E run completed"

  e2e-gate:
    name: E2E Gate
    runs-on: ubuntu-latest
    needs: [comment-context, e2e-internal, e2e-prod]
    if: always()
    steps:
      - name: Evaluate E2E outcomes
        env:
          INTERNAL_RESULT: ${{ needs.e2e-internal.result }}
          PROD_RESULT: ${{ needs.e2e-prod.result }}
          SHOULD_RUN: ${{ needs.comment-context.outputs.should_run }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          ENABLE_E2E_COMMENT_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION || '' }}
        run: |
          set -euo pipefail

          echo "Internal result: $INTERNAL_RESULT"
          echo "Prod result: $PROD_RESULT"
          echo "should_run: ${SHOULD_RUN:-<empty>}"

          if [ "$INTERNAL_RESULT" = "success" ] && [ "$PROD_RESULT" = "success" ]; then
            echo "Both E2E jobs succeeded"
            exit 0
          fi

          # Strict mode when comment validation is disabled:
          # both internal and prod must be success; skipped is treated as failure.
          if [ "$ENABLE_E2E_COMMENT_VALIDATION" != "true" ]; then
            echo "ENABLE_E2E_COMMENT_VALIDATION=false: both E2E jobs must be success. Current results: internal=$INTERNAL_RESULT, prod=$PROD_RESULT"
            exit 1
          fi

          if [ "$INTERNAL_RESULT" = "failure" ] || [ "$PROD_RESULT" = "failure" ] || [ "$INTERNAL_RESULT" = "cancelled" ] || [ "$PROD_RESULT" = "cancelled" ]; then
            echo "At least one E2E job failed or was cancelled"
            exit 1
          fi

          if [ "$INTERNAL_RESULT" = "skipped" ] && [ "$PROD_RESULT" != "skipped" ]; then
            if [ "$EVENT_NAME" = "issue_comment" ] && echo "$COMMENT_BODY" | grep -qiE '^/(runtests|runchecks)\b'; then
              echo "Internal E2E was skipped after /runtests or /runchecks. Check why it was skipped."
            else
              echo "Internal E2E was skipped while Prod was $PROD_RESULT."
            fi
            exit 1
          fi

          if [ "$PROD_RESULT" = "skipped" ] && [ "$INTERNAL_RESULT" != "skipped" ]; then
            if [ "$EVENT_NAME" = "issue_comment" ] && echo "$COMMENT_BODY" | grep -qiE '^/(runtests|runchecks)\b'; then
              echo "Prod E2E was skipped after /runtests or /runchecks. Check why it was skipped."
            else
              echo "Prod E2E was skipped while Internal was $INTERNAL_RESULT."
            fi
            exit 1
          fi

          if [ "$INTERNAL_RESULT" = "skipped" ] && [ "$PROD_RESULT" = "skipped" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "E2E is gated for PR events. Use /runtests or /runchecks command to run it."
              exit 1
            fi

            if [ "$EVENT_NAME" = "issue_comment" ] && echo "$COMMENT_BODY" | grep -qiE '^/(runtests|runchecks)\b'; then
              echo "Both E2E jobs were skipped after /runtests or /runchecks. Check why they were skipped."
              exit 1
            fi

            if [ "${SHOULD_RUN:-}" = "true" ]; then
              echo "Both E2E jobs were skipped while should_run=true."
              exit 1
            fi

            echo "Both E2E jobs were skipped and should_run=false; treating as normal behavior"
            exit 0
          fi

          if [ "${SHOULD_RUN:-}" = "true" ]; then
            echo "E2E was expected, but jobs did not both succeed"
            exit 1
          fi

          echo "E2E was not required; allowing workflow to continue"
          exit 0

  complete_checks:
    runs-on: ubuntu-latest
    needs: [create_checks, e2e-gate]
    if: always() && needs.create_checks.result == 'success'
    permissions:
      checks: write
    steps:
      - name: Mark E2E checks success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_RUN_IDS: ${{ needs.create_checks.outputs.check_run_ids }}
          E2E_GATE_RESULT: ${{ needs.e2e-gate.result }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          if [ "$E2E_GATE_RESULT" = "success" ]; then
            CONCLUSION="success"
          else
            CONCLUSION="failure"
          fi

          IFS=',' read -ra IDS <<< "$CHECK_RUN_IDS"
          for CHECK_ID in "${IDS[@]}"; do
            [ -z "$CHECK_ID" ] && continue
            curl -sS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$API/check-runs/$CHECK_ID" \
              -d "{\"conclusion\":\"$CONCLUSION\",\"status\":\"completed\"}"
            echo "Completed check $CHECK_ID with conclusion=$CONCLUSION"
          done
