name: Pull Request Validation

# RULESET: Require the checks "Validation" and "E2E (Internal & Prod)" in branch protection.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  validation:
    uses: ./.github/workflows/mock-snyk-scan.yml

  comment-context:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
    permissions:
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate E2E run context
        id: eval
        uses: actions/github-script@v7
        env:
          ENABLE_E2E_COMMENT_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}
        with:
          script: |
            const path = require('path');
            const run = require(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/comment-context.cjs'
            ));
            await run({ core, context });
          
  e2e-internal:
    if: always() && needs.comment-context.outputs.should_run == 'true'
    name: E2E Tests (Internal)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock internal E2E run completed
        run: sleep 1m && echo "Mock internal E2E run completed" 

  e2e-prod:
    if: always() && needs.comment-context.outputs.should_run == 'true'
    name: E2E Tests (Prod)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock Prod E2E run completed
        run: echo "Mock Prod E2E run completed"

  e2e-gate:
    permissions:
      checks: write
    runs-on: ubuntu-latest
    name: E2E (Internal & Prod)
    needs: [validation, comment-context, e2e-internal, e2e-prod]
    # Force this job to run even if upstream jobs fail or are skipped
    if: always() 
    steps:
      # SCENARIO 1: Upstream tests explicitly failed
      - name: Report Failure
        if: |
          needs.e2e-internal.result == 'failure' || 
          needs.e2e-prod.result == 'failure' || 
          needs.validation.result == 'failure'
        run: |
          echo "::error::Test failed. Check the logs above and fix it."
          exit 1

      # SCENARIO 2: Upstream tests were skipped entirely
      - name: Report Not Run
        if: |
          needs.e2e-internal.result == 'skipped' || 
          needs.e2e-prod.result == 'skipped'
        run: |
          echo "::error::Tests never ran. Trigger a run with comment /runtests"
          exit 1

      # SCENARIO 3: Everything passed perfectly
      - name: Success Gate
        if: |
          needs.e2e-internal.result == 'success' && 
          needs.e2e-prod.result == 'success' && 
          needs.validation.result == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const checkName = 'E2E (Internal & Prod)'; // Replace with your check's name

            // 1. Find any existing check run with this name for the current commit
            const listResponse = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              check_name: checkName,
            });

            const existingCheck = listResponse.data.check_runs[0];

            if (existingCheck) {
              // 2. If it exists, update it to success
              await github.rest.checks.update({
                owner,
                repo,
                check_run_id: existingCheck.id,
                status: 'completed',
                conclusion: 'success',
              });
              console.log(`Updated existing check run (ID: ${existingCheck.id}) to success.`);
            } else {
              // 3. If it doesn't exist, create a new one with a success status
              await github.rest.checks.create({
                owner,
                repo,
                name: checkName,
                head_sha: sha,
                status: 'completed',
                conclusion: 'success',
              });
              console.log(`Created a new check run '${checkName}' with success status.`);
            }


    

