name: Pull Request Validation

# RULESET: Require the checks "Validation" and "E2E (Internal & Prod)" in branch protection.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  validation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/mock-snyk-scan.yml

  comment-context:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
      pull_number: ${{ steps.eval.outputs.pull_number }}
      head_sha: ${{ steps.eval.outputs.head_sha }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Evaluate comment authorization and command
        id: eval
        uses: actions/github-script@v7
        with:
          script: |
            const enable = `${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}` === 'true';
            const issue = context.payload.issue;
            const commentBody = (context.payload.comment?.body || '').trim();
            const association = context.payload.comment?.author_association || '';
            const allowedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            let shouldRun = false;
            let pullNumber = '';
            let headSha = '';

            if (enable && issue?.pull_request && commentBody === '/runtests' && allowedAssociations.has(association)) {
              pullNumber = String(issue.number);
              const { owner, repo } = context.repo;
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: issue.number });
              headSha = pr.data.head.sha;
              shouldRun = true;
            }

            core.setOutput('should_run', shouldRun ? 'true' : 'false');
            core.setOutput('pull_number', pullNumber);
            core.setOutput('head_sha', headSha);

  e2e-internal:
    if: >
      always() && (
        (github.event_name == 'pull_request' && vars.ENABLE_E2E_COMMENT_VALIDATION != 'true') ||
        (github.event_name == 'issue_comment' && needs.comment-context.outputs.should_run == 'true')
      )
    name: E2E Tests (Internal)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock internal E2E run completed
        run: echo "Mock internal E2E run completed"

  e2e-prod:
    if: >
      always() && (
        (github.event_name == 'pull_request' && vars.ENABLE_E2E_COMMENT_VALIDATION != 'true') ||
        (github.event_name == 'issue_comment' && needs.comment-context.outputs.should_run == 'true')
      )
    name: E2E Tests (Prod)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock Prod E2E run completed
        run: echo "Mock Prod E2E run completed"

  e2e-gate:
    runs-on: ubuntu-latest
    name: E2E Gate Reporter
    needs: [validation, comment-context, e2e-internal, e2e-prod]
    if: >
      always() && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' && needs.comment-context.outputs.should_run == 'true')
      )
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Evaluate and publish required E2E check
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = `${{ github.event_name }}`;
            const validation = `${{ needs.validation.result }}`;
            const internal = `${{ needs['e2e-internal'].result }}`;
            const prod = `${{ needs['e2e-prod'].result }}`;
            const enableE2ECommentValidation = `${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}` === 'true';

            let conclusion = 'success';
            let title = 'E2E Internal and Prod passed';
            let summary = `internal=${internal}, prod=${prod}`;

            if (eventName === 'pull_request' && validation !== 'success') {
              conclusion = 'failure';
              title = 'Validation did not succeed';
              summary = `Validation result is ${validation}.`;
            } else if (eventName === 'pull_request' && enableE2ECommentValidation) {
              if (internal === 'success' && prod === 'success') {
                conclusion = 'success';
                title = 'E2E Internal and Prod passed';
                summary = 'Both E2E stages passed in this run.';
              } else {
                conclusion = 'failure';
                title = 'E2E not started';
                summary = 'Comment /runtests on this PR to run E2E on the latest head commit.';
              }
            } else if (internal === 'success' && prod === 'success') {
              conclusion = 'success';
              title = 'E2E Internal and Prod passed';
              summary = 'Both E2E stages passed in continuous mode.';
            } else {
              conclusion = 'failure';
              title = 'E2E failed';
              summary = `E2E gate failed: internal=${internal}, prod=${prod}`;
            }

            const { owner, repo } = context.repo;
            const head_sha = eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : `${{ needs['comment-context'].outputs.head_sha }}`;
            const pull_number = eventName === 'pull_request'
              ? context.payload.pull_request.number
              : `${{ needs['comment-context'].outputs.pull_number }}`;
            const checksUrl = `https://github.com/${owner}/${repo}/pull/${pull_number}/checks`;

            const existing = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: head_sha,
              check_name: 'E2E (Internal & Prod)',
              per_page: 100
            });

            const existingRun = existing.data.check_runs
              .filter((run) => run.name === 'E2E (Internal & Prod)')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            if (existingRun) {
              await github.rest.checks.update({
                owner,
                repo,
                check_run_id: existingRun.id,
                status: 'completed',
                conclusion,
                details_url: checksUrl,
                output: {
                  title,
                  summary
                }
              });
            } else {
              await github.rest.checks.create({
                owner,
                repo,
                name: 'E2E (Internal & Prod)',
                head_sha,
                status: 'completed',
                conclusion,
                details_url: checksUrl,
                output: {
                  title,
                  summary
                }
              });
            }

            if (conclusion === 'failure') {
              core.setFailed(summary);
            }
