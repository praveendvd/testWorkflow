name: Pull Request Validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  validation:
    uses: ./.github/workflows/mock-snyk-scan.yml

  comment-context:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
      check_run_id: ${{ steps.eval.outputs.check_run_id }}
      pull_number: ${{ steps.eval.outputs.pull_number }}
      branch_name: ${{ steps.eval.outputs.branch_name }}
      triggered_by_slash: ${{ steps.eval.outputs.triggered_by_slash }}
    permissions:
      checks: write
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate context and create check
        id: eval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_E2E_COMMENT_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}
        run: |
          chmod +x .github/scripts/comment-context.sh
          .github/scripts/comment-context.sh

  e2e-internal:
    if: always() && needs.comment-context.outputs.should_run == 'true'
    name: E2E Tests (Internal)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock internal E2E run completed
        run: sleep 1m && echo "Mock internal E2E run completed"

  e2e-prod:
    if: always() && needs.comment-context.outputs.should_run == 'true'
    name: E2E Tests (Prod)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock Prod E2E run completed
        run: echo "Mock Prod E2E run completed"

  e2e-gate:
    permissions:
      checks: write
      issues: write
    runs-on: ubuntu-latest
    name: E2E Gate
    needs: [validation, comment-context, e2e-internal, e2e-prod]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Update E2E Gate Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_INTERNAL_RESULT: ${{ needs.e2e-internal.result }}
          E2E_PROD_RESULT: ${{ needs.e2e-prod.result }}
          ENABLE_E2E_COMMENT_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}
          CHECK_RUN_ID: ${{ needs.comment-context.outputs.check_run_id }}
          PULL_NUMBER: ${{ needs.comment-context.outputs.pull_number }}
          BRANCH_NAME: ${{ needs.comment-context.outputs.branch_name }}
          TRIGGERED_BY_SLASH: ${{ needs.comment-context.outputs.triggered_by_slash }}
        run: |
          chmod +x .github/scripts/e2e-gate.sh
          .github/scripts/e2e-gate.sh