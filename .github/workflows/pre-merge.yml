name: Pull Request Validation

# RULESET: Require the checks "Validation" and "E2E (Internal & Prod)" in branch protection.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  validation:
    uses: ./.github/workflows/mock-snyk-scan.yml

  comment-context:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
    permissions:
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate E2E run context
        id: eval
        uses: actions/github-script@v7
        env:
          ENABLE_E2E_COMMENT_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}
        with:
          script: |
            const path = require('path');
            const run = require(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/comment-context.cjs'
            ));
            await run({ core, context });
          
  e2e-internal:
    if: always() && needs.comment-context.outputs.should_run == 'true'
    name: E2E Tests (Internal)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock internal E2E run completed
        run: sleep 1m && echo "Mock internal E2E run completed" 

  e2e-prod:
    if: always() && needs.comment-context.outputs.should_run == 'true'
    name: E2E Tests (Prod)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock Prod E2E run completed
        run: echo "Mock Prod E2E run completed"

  e2e-gate:
    permissions:
      checks: write
    runs-on: ubuntu-latest
    name: E2E Gate
    needs: [validation, comment-context, e2e-internal, e2e-prod]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run E2E Gate Script
        uses: actions/github-script@v7
        env:
          # Pass the results of upstream jobs as environment variables
          E2E_INTERNAL_RESULT: ${{ needs.e2e-internal.result }}
          E2E_PROD_RESULT: ${{ needs.e2e-prod.result }}
          # Pass your repository variable (boolean)
          ENABLE_E2E_COMMENT_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}
          # For issue_comment events, pass the head SHA and PR number
          COMMENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.issue.pull_request.head.sha || '' }}
          COMMENT_PULL_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || '' }}
        with:
        script: |
          // Require the external .cjs script from your repository
          const script = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/e2e-gate.cjs`);
          // Call the exported function, passing the github and context objects
          await script({ github, context });
    
            


    

