name: Pull Request Validation

# RULESET: Require the checks "Validation" and "E2E (Internal & Prod)" in branch protection.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  validation:
    uses: ./.github/workflows/mock-snyk-scan.yml

  comment-context:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
      check_run_id: ${{ steps.eval.outputs.check_run_id }}
    permissions:
      checks: write
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate context and create check
        id: eval
        uses: actions/github-script@v7
        env:
          ENABLE_E2E_COMMENT_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}
        with:
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/comment-context.cjs`);
            await script({ core, context, github });
          
  e2e-internal:
    if: always() && needs.comment-context.outputs.should_run == 'true'
    name: E2E Tests (Internal)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock internal E2E run completed
        run: sleep 1m && echo "Mock internal E2E run completed" 

  e2e-prod:
    if: always() && needs.comment-context.outputs.should_run == 'true'
    name: E2E Tests (Prod)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock Prod E2E run completed
        run: echo "Mock Prod E2E run completed"

  e2e-gate:
    permissions:
      checks: write
    runs-on: ubuntu-latest
    name: E2E Gate
    needs: [validation, comment-context, e2e-internal, e2e-prod]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Update E2E Gate Check
        uses: actions/github-script@v7
        env:
          E2E_INTERNAL_RESULT: ${{ needs.e2e-internal.result }}
          E2E_PROD_RESULT: ${{ needs.e2e-prod.result }}
          ENABLE_E2E_COMMENT_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}
          CHECK_RUN_ID: ${{ needs.comment-context.outputs.check_run_id }}
        with:
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/e2e-gate.cjs`);
            await script({ core, context, github });
            


    

