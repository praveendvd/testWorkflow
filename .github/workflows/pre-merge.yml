name: Pull Request Validation

# RULESET: Require the checks "Validation" and "E2E (Internal & Prod)" in branch protection.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  validation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/mock-snyk-scan.yml

  comment-context:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
      pull_number: ${{ steps.eval.outputs.pull_number }}
      head_sha: ${{ steps.eval.outputs.head_sha }}
      check_run_id: ${{ steps.eval.outputs.check_run_id }}
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate E2E run context
        id: eval
        uses: actions/github-script@v7
        env:
          ENABLE_E2E_COMMENT_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}
        with:
          script: |
            const path = require('path');
            const run = require(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/comment-context.cjs'
            ));
            await run({ core, github, context });
          
  e2e-internal:
    if: always() && needs.comment-context.outputs.should_run == 'true'
    name: E2E Tests (Internal)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock internal E2E run completed
        run: sleep 1m && echo "Mock internal E2E run completed" 

  e2e-prod:
    if: always() && needs.comment-context.outputs.should_run == 'true'
    name: E2E Tests (Prod)
    needs: [validation, comment-context]
    runs-on: ubuntu-latest
    steps:
      - name: Mock Prod E2E run completed
        run: echo "Mock Prod E2E run completed"

  e2e-gate:
    runs-on: ubuntu-latest
    name: E2E Gate Reporter
    needs: [validation, comment-context, e2e-internal, e2e-prod]
    if: >
      always() && (
        github.event_name == 'pull_request' ||
        needs.comment-context.outputs.should_run == 'true'
      )
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate and publish required E2E check
        uses: actions/github-script@v7
        env:
          ENABLE_E2E_COMMENT_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          E2E_INTERNAL_RESULT: ${{ needs['e2e-internal'].result }}
          E2E_PROD_RESULT: ${{ needs['e2e-prod'].result }}
          COMMENT_HEAD_SHA: ${{ needs.comment-context.outputs.head_sha }}
          COMMENT_PULL_NUMBER: ${{ needs.comment-context.outputs.pull_number }}
          COMMENT_CHECK_RUN_ID: ${{ needs.comment-context.outputs.check_run_id }}
        with:
          script: |
            const path = require('path');
            const run = require(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/e2e-gate.cjs'
            ));
            await run({ github, context });
