name: Pull Request Validation

# RULESET: Require the single check "E2E (Internal & Prod)" in branch protection.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - master
      - rc-sas
      - 'release/**'
  issue_comment:
    types: [created]  # Needed to react to slash commands

jobs:
  check-slash-command:
    uses: ./.github/workflows/check-slash-command.yml

  validation:
    uses: ./.github/workflows/mock-snyk-scan.yml  # ✅ Corrected path
    # If this is a reusable workflow, you might not need '@master'

  e2e-internal:
    if: needs.check-slash-command.outputs.should_run == 'true'
    name: E2E Tests (Internal)
    needs: [validation, check-slash-command]
    run: echo "hi internal done"
  

  e2e-prod:
    if: needs.check-slash-command.outputs.should_run == 'true'
    name: E2E Tests (Prod)
    needs: [validation, check-slash-command]
    run: echo "hi prd done"

  e2e-gate:
    name: E2E (Internal & Prod)
    runs-on: group: RXP-wdci-small
    needs: [validation, e2e-internal, e2e-prod]
    if: always()
    steps:
      - name: Gate - validation and E2E passed
        run: |
          VALIDATION="${{ needs.validation.result }}"
          INTERNAL="${{ needs.e2e-internal.result }}"
          PROD="${{ needs.e2e-prod.result }}"
          ENABLE_E2E_COMMENT_VALIDATION="${{ vars.ENABLE_E2E_COMMENT_VALIDATION == 'true' }}"

          if [ "$VALIDATION" != 'success' ]; then
            echo "Validation did not succeed (result=$VALIDATION) — gate fails"
            exit 1
          fi

          if [ "$ENABLE_E2E_COMMENT_VALIDATION" = 'true' ]; then
            if [ -z "$INTERNAL" ] || [ -z "$PROD" ] || [ "$INTERNAL" = 'skipped' ] || [ "$PROD" = 'skipped' ]; then
              echo "::error::E2E stages were not run. Please trigger E2E tests using /runtests or /runchecks comment."
              exit 1
            fi
          fi

          if [ "$INTERNAL" = 'success' ] && [ "$PROD" = 'success' ]; then
            echo "E2E Internal and Prod passed — gate passes"
            exit 0
          fi

          echo "E2E gate failed: internal=$INTERNAL prod=$PROD"
          exit 1