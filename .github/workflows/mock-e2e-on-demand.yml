name: mock-e2e-on-demand

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  e2e-on-demand:
    name: e2e-on-demand
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        contains(github.event.comment.body, '/runtests') ||
        contains(github.event.comment.body, '/runchecks')
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Get PR head SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.issue.number;
            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('head_branch', pr.data.head.ref);
            core.setOutput('pull_number', pull_number.toString());

      - name: Mock E2E Internal
        id: mock_e2e_internal
        run: echo "e2e internal passed"

      - name: Mock E2E Prod
        id: mock_e2e_prod
        run: echo "e2e prod passed"
