name: mock-e2e-on-demand

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  e2e-required-until-runtests:
    name: e2e-required-until-runtests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Mark E2E check as required via slash command
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head_sha = context.payload.pull_request.head.sha;
            const pull_number = context.payload.pull_request.number;
            const checksUrl = `https://github.com/${owner}/${repo}/pull/${pull_number}/checks`;
            await github.rest.checks.create({
              owner,
              repo,
              name: 'e2e-on-demand',
              head_sha,
              status: 'completed',
              conclusion: 'failure',
              details_url: checksUrl,
              output: {
                title: 'E2E not started',
                summary: 'Run /runtests (or /runchecks) in this PR to start E2E validation for this commit.'
              }
            });

  e2e-on-demand:
    name: e2e-on-demand
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        contains(github.event.comment.body, '/runtests') ||
        contains(github.event.comment.body, '/runchecks')
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Get PR head SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.issue.number;
            const pr = await github.rest.pulls.get({ owner, repo, pull_number });
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('head_branch', pr.data.head.ref);
            core.setOutput('pull_number', pull_number.toString());

      - name: Mark E2E check as in progress
        id: start_check
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const head_sha = process.env.HEAD_SHA;
            const result = await github.rest.checks.create({
              owner,
              repo,
              name: 'e2e-on-demand',
              head_sha,
              status: 'in_progress',
              details_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              output: {
                title: 'Mock E2E started',
                summary: 'Triggered by /runtests comment'
              }
            });
            core.setOutput('check_run_id', result.data.id.toString());

      - name: Comment that slash-command checks started
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
          PULL_NUMBER: ${{ steps.pr.outputs.pull_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PULL_NUMBER);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const checksUrl = `https://github.com/${owner}/${repo}/pull/${pull_number}/checks`;
            const shortSha = process.env.HEAD_SHA.slice(0, 7);
            const body = [
              'PR checks were requested via slash command (/runchecks / /runtests).',
              '',
              `Branch: ${process.env.HEAD_BRANCH}`,
              `Commit: ${shortSha}`,
              `Dispatched: mock-e2e-on-demand.yml@${process.env.HEAD_BRANCH}`,
              `Workflow run: [${context.workflow}](${runUrl})`,
              `PR checks: [View checks](${checksUrl})`,
              'Track progress in GitHub Actions (workflow run links above). Required checks update when jobs finish.',
              'Re-run after new pushes with /runchecks (or /runtests).'
            ].join('\n');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body
            });

      - name: Mock E2E Internal
        id: mock_e2e_internal
        run: echo "e2e internal passed"

      - name: Mock E2E Prod
        id: mock_e2e_prod
        run: echo "e2e prod passed"

      - name: Mark E2E check as completed
        if: always() && steps.start_check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const conclusion = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const internalOutcome = '${{ steps.mock_e2e_internal.outcome }}';
            const prodOutcome = '${{ steps.mock_e2e_prod.outcome }}';
            const title = conclusion === 'success' ? 'Mock E2E completed' : 'Mock E2E failed';
            const summary = `E2E Internal: ${internalOutcome}, E2E Prod: ${prodOutcome}`;
            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: Number('${{ steps.start_check.outputs.check_run_id }}'),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title,
                summary
              }
            });

      - name: Comment with slash-command E2E result
        if: always() && steps.start_check.outcome == 'success'
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PULL_NUMBER: ${{ steps.pr.outputs.pull_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PULL_NUMBER);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const checksUrl = `https://github.com/${owner}/${repo}/pull/${pull_number}/checks`;
            const conclusion = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const internalOutcome = '${{ steps.mock_e2e_internal.outcome }}';
            const prodOutcome = '${{ steps.mock_e2e_prod.outcome }}';
            const headline = conclusion === 'success'
              ? 'Slash-command E2E passed for this commit.'
              : 'Slash-command E2E failed for this commit.';
            const validation = `${conclusion} · E2E Internal: ${internalOutcome} · E2E Prod: ${prodOutcome}`;
            const shortSha = process.env.HEAD_SHA.slice(0, 7);
            const body = [
              headline,
              '',
              `Commit: ${shortSha}`,
              `Workflow run: [View workflow run](${runUrl})`,
              `Required check: e2e-on-demand — ${conclusion}`,
              `PR checks: [PR checks](${checksUrl})`,
              `Validation: ${validation}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body
            });
