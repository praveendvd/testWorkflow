name: mock-snyk-scan

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Commit SHA to run validation against"
        required: false
        type: string
  workflow_call:
    inputs:
      head_sha:
        description: "Commit SHA to run validation against"
        required: false
        type: string

permissions:
  contents: read

env:
  SNYK_FAIL: ${{ vars.SNYK_FAIL }}

jobs:
  snyk-scan:
    name: snyk-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        if: inputs.head_sha != ''
        with:
          ref: ${{ inputs.head_sha }}
      - name: Checkout default ref
        uses: actions/checkout@v4
        if: inputs.head_sha == ''
      - name: Show checked out commit
        run: echo "Validation running on commit $(git rev-parse HEAD)"
      - name: Mock Snyk scan start
        run: echo "scan ran"
      - name: Mock Snyk scan progress
        run: echo "scan progress"
      - name: Mock Snyk scan complete
        run: echo "scan completed"
      - name: fail snyk scan
        if: env.SNYK_FAIL == 'true'   
        run: exit 1
