name: mock-snyk-scan

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  SNYK_FAIL: ${{ vars.SNYK_FAIL }}

jobs:
  snyk-scan:
    name: snyk-scan
    runs-on: ubuntu-latest
    steps:
      - name: Mock Snyk scan start
        run: echo "scan ran"
      - name: Mock Snyk scan progress
        run: echo "scan progress"
      - name: Mock Snyk scan complete
        run: echo "scan completed"
      - name: fail snyk scan
        if: env.SNYK_FAIL == 'true'   
        run: exit 1
