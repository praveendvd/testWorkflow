name: Check Slash Command Condition

on:
  workflow_call:
    outputs:
      should_run:
        description: "Whether the slash command condition is met (true/false)"
        value: ${{ jobs.check.outputs.should_run }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.condition.outputs.should_run }}
    
    steps:
      - id: condition
        env:
          ENABLE_VALIDATION: ${{ vars.ENABLE_E2E_COMMENT_VALIDATION }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -e

          enable_validation="${ENABLE_VALIDATION:-false}"
          should_run="false"

          # 1. If validation is NOT explicitly "true", always run
          if [[ "${enable_validation}" != "true" ]]; then
            should_run="true"
          else
            # 2. Validation is enabled: check if the event is an issue_comment
            if [[ "${GITHUB_EVENT_NAME}" != "issue_comment" ]]; then
              should_run="false"
            else
              # 3. Extract data safely from the event payload using jq
              # Get the comment body (empty string if null)
              comment_raw=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")
              # Trim leading/trailing whitespace in pure Bash
              comment="${comment_raw#"${comment_raw%%[![:space:]]*}"}"
              comment="${comment%"${comment##*[![:space:]]}"}"

              # Get author association
              association=$(jq -r '.comment.author_association // ""' "$GITHUB_EVENT_PATH")
              
              # Check if this is a PR comment (issue.pull_request exists)
              is_pr=$(jq -r '.issue.pull_request != null' "$GITHUB_EVENT_PATH")

              allowed="false"

              # 4. Logic: isPr && allowedAuthors && allowedCommands
              if [[ "${is_pr}" == "true" ]]; then
                # Check author association
                if [[ "${association}" == "OWNER" || \
                      "${association}" == "MEMBER" || \
                      "${association}" == "COLLABORATOR" ]]; then
                  # Check exact command match
                  if [[ "${comment}" == "/runtests" || \
                        "${comment}" == "/runchecks" ]]; then
                    allowed="true"
                  fi
                fi
              fi

              if [[ "${allowed}" == "true" ]]; then
                should_run="true"
              else
                should_run="false"
              fi
            fi
          fi

          # 5. Set the output for other jobs to consume
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"