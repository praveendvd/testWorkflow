name: Manage GitHub Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  create_checks:
    runs-on: ubuntu-latest
    permissions:
      checks: write      # Required to create check runs
      contents: read     # Required to read commit info
    
    outputs:
      last_check_id: ${{ steps.check_creator.outputs.last_id }}

    steps:
      - name: Create 5 Checks and Save Last ID
        id: check_creator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECK_NAME="E2E (Internal & Prod)"
          STATUS="in_progress"
          
          # Securely look up the commit SHA based on context
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            HEAD_SHA="${{ github.sha }}"
          fi
          
          if [ -z "$HEAD_SHA" ]; then
            echo "Warning: HEAD_SHA was empty. Attempting branch lookup..."
            HEAD_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              https://github.com{{ github.repository }}/commits/main | jq -r '.sha')
          fi

          echo "Target Commit SHA: $HEAD_SHA"
          
          # Loop 5 times to create 5 distinct checks with the same name
          for i in {1..5}
          do
            echo "Creating check run #$i..."
            
            # FIXED URL STRUCTURE BELOW
            RESPONSE=$(curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://github.com{{ github.repository }}/check-runs" \
              -d "{\"name\":\"$CHECK_NAME\",\"head_sha\":\"$HEAD_SHA\",\"status\":\"$STATUS\"}")
            
            CHECK_ID=$(echo "$RESPONSE" | jq -r '.id')
            echo "Check run #$i created with ID: $CHECK_ID"
          done
          
          if [ "$CHECK_ID" = "null" ] || [ -z "$CHECK_ID" ]; then
            echo "Error: Check creation failed. Response received: $RESPONSE"
            exit 1
          fi

          echo "last_id=$CHECK_ID" >> "$GITHUB_OUTPUT"

  use_check_id:
    runs-on: ubuntu-latest
    needs: create_checks
    permissions:
      checks: write      # Required to update check runs
    
    steps:
      - name: Update Last Check to Success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ID: ${{ needs.create_checks.outputs.last_check_id }}
        run: |
          if [ -z "$CHECK_ID" ] || [ "$CHECK_ID" = "null" ]; then
            echo "Error: Received an invalid Check ID from the previous job step."
            exit 1
          fi

          echo "Updating check ID: $CHECK_ID to completed/success..."
          
          # FIXED URL STRUCTURE BELOW
          curl -s -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://github.com{{ github.repository }}/check-runs/$CHECK_ID" \
            -d '{"status":"completed","conclusion":"success"}'
            
          echo "Check ID $CHECK_ID has been successfully updated!"
