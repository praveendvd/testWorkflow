name: Manage GitHub Checks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  create_checks:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    outputs:
      last_check_id: ${{ steps.check_creator.outputs.last_id }}
    steps:
      - name: Create 5 Checks and Save Last ID
        id: check_creator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CHECK_NAME="E2E (Internal & Prod)"
          STATUS="in_progress"

          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Target Commit SHA: $HEAD_SHA"

          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            echo "ERROR: HEAD_SHA is empty or null"
            exit 1
          fi

          LAST_ID=""
          for i in {1..5}; do
            echo "Creating check run #$i..."
            CHECK_ID=$(gh api \
              -X POST /repos/${{ github.repository }}/check-runs \
              -f name="$CHECK_NAME" \
              -f head_sha="$HEAD_SHA" \
              -f status="$STATUS" \
              --jq '.id')

            if [ -z "$CHECK_ID" ] || [ "$CHECK_ID" = "null" ]; then
              echo "ERROR: Failed to create check run #$i"
              exit 1
            fi

            echo "Check run #$i created with ID: $CHECK_ID"
            LAST_ID="$CHECK_ID"
          done

          echo "last_id=$LAST_ID" >> "$GITHUB_OUTPUT"

  update_all:
    runs-on: ubuntu-latest
    needs: create_checks
    if: always() && needs.create_checks.result == 'success'
    permissions:
      checks: write
    steps:
      - name: Fetch all checks, log them, cancel all, then mark last as success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LAST_CHECK_ID: ${{ needs.create_checks.outputs.last_check_id }}
        run: |
          echo "Fetching all check runs for commit $HEAD_SHA (name: E2E (Internal & Prod))"
          
          # Get all check runs (with pagination just in case)
          CHECK_DATA=$(gh api --paginate /repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs \
            --jq '.check_runs[] | select(.name=="E2E (Internal & Prod)") | {id: .id, status: .status, conclusion: .conclusion}')

          if [ -z "$CHECK_DATA" ]; then
            echo "No checks found with that name."
            exit 0
          fi

          echo "Found the following checks:"
          echo "$CHECK_DATA" | jq '.'

          # Extract IDs
          CHECK_IDS=$(echo "$CHECK_DATA" | jq -r '.id')

          if [ -z "$CHECK_IDS" ]; then
            echo "No check IDs found."
            exit 0
          fi

          # Cancel all checks
          for CHECK_ID in $CHECK_IDS; do
            echo "Cancelling check $CHECK_ID..."
            gh api -X PATCH /repos/${{ github.repository }}/check-runs/$CHECK_ID \
              -f status="completed" \
              -f conclusion="cancelled" \
              --silent
          done

          # Now mark the last created check as success
          if [ -n "$LAST_CHECK_ID" ] && [ "$LAST_CHECK_ID" != "null" ]; then
            echo "Marking last check $LAST_CHECK_ID as success..."
            gh api -X PATCH /repos/${{ github.repository }}/check-runs/$LAST_CHECK_ID \
              -f status="completed" \
              -f conclusion="success" \
              --silent
          else
            echo "Warning: LAST_CHECK_ID is not set, skipping final success update."
          fi

          echo "All checks processed."