name: Manage GitHub Checks

jobs:
  create_checks:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    outputs:
      last_check_id: ${{ steps.check_creator.outputs.last_id }}

    steps:
      - name: Create 5 Checks and Save Last ID
        id: check_creator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECK_NAME="E2E (Internal & Prod)"
          STATUS="in_progress"
          
          # Get commit SHA from PR context (uses PR head if available, else current commit)
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Target Commit SHA: $HEAD_SHA"
          
          # Loop 5 times to create 5 distinct checks
          for i in {1..5}; do
            echo "Creating check run #$i..."
            
            RESPONSE=$(curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/check-runs" \
              -d "{\"name\":\"$CHECK_NAME\",\"head_sha\":\"$HEAD_SHA\",\"status\":\"$STATUS\"}")
            
            CHECK_ID=$(echo "$RESPONSE" | jq -r '.id')
            echo "Check run #$i created with ID: $CHECK_ID"
            
            # Keep the last ID for the next job
            LAST_ID="$CHECK_ID"
          done
          
          if [ -z "$LAST_ID" ] || [ "$LAST_ID" = "null" ]; then
            echo "Error: Check creation failed. Response received: $RESPONSE"
            exit 1
          fi
          
          echo "last_id=$LAST_ID" >> "$GITHUB_OUTPUT"

  use_check_id:
    runs-on: ubuntu-latest
    needs: create_checks
    permissions:
      checks: write
    steps:
      - name: Update Last Check to Success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ID: ${{ needs.create_checks.outputs.last_check_id }}
        run: |
          if [ -z "$CHECK_ID" ] || [ "$CHECK_ID" = "null" ]; then
            echo "Error: Invalid Check ID"
            exit 1
          fi
          
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs/$CHECK_ID" \
            -d '{"status":"completed","conclusion":"success"}'