name: Manage GitHub Checks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  create_checks:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    outputs:
      last_check_id: ${{ steps.check_creator.outputs.last_id }}
    steps:
      - name: Create 5 Checks and Save Last ID
        id: check_creator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CHECK_NAME="E2E (Internal & Prod)"
          STATUS="in_progress"

          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Target Commit SHA: $HEAD_SHA"

          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            echo "ERROR: HEAD_SHA is empty or null"
            exit 1
          fi

          LAST_ID=""
          for i in {1..5}; do
            echo "Creating check run #$i..."
            CHECK_ID=$(gh api \
              -X POST /repos/${{ github.repository }}/check-runs \
              -f name="$CHECK_NAME" \
              -f head_sha="$HEAD_SHA" \
              -f status="$STATUS" \
              --jq '.id')

            if [ -z "$CHECK_ID" ] || [ "$CHECK_ID" = "null" ]; then
              echo "ERROR: Failed to create check run #$i"
              exit 1
            fi

            echo "Check run #$i created with ID: $CHECK_ID"
            LAST_ID="$CHECK_ID"
          done

          echo "last_id=$LAST_ID" >> "$GITHUB_OUTPUT"

      - name: Wait 30 seconds to observe in-progress state
        run: |
          echo "All 5 checks are now in 'in_progress'. You have 30 seconds to check the PR page."
          sleep 30

  update_all:
    runs-on: ubuntu-latest
    needs: create_checks
    if: always() && needs.create_checks.result == 'success'
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Cancel all stale checks, then create a fresh successful check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CHECK_NAME="E2E (Internal & Prod)"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          REPO="${{ github.repository }}"

          echo "=== Step 1: Fetch all commits in PR ==="
          COMMITS=$(gh api /repos/$REPO/pulls/$PR_NUMBER/commits --jq '.[].sha')
          echo "Commits: $COMMITS"

          echo "=== Step 2: Cancel all matching checks on all commits ==="
          for SHA in $COMMITS; do
            STALE_IDS=$(gh api /repos/$REPO/commits/$SHA/check-runs \
              --jq '.check_runs[] | select(.name=="'"$CHECK_NAME"'") | .id')
            if [ -n "$STALE_IDS" ]; then
              for CID in $STALE_IDS; do
                echo "Cancelling check $CID on commit $SHA"
                gh api -X PATCH /repos/$REPO/check-runs/$CID \
                  -f status="completed" -f conclusion="cancelled" --silent
              done
            fi
          done

          # Small pause to let GitHub process cancellations
          sleep 2

          echo "=== Step 3: Create a brand new check on HEAD commit ==="
          NEW_CHECK_ID=$(gh api -X POST /repos/$REPO/check-runs \
            -f name="$CHECK_NAME" \
            -f head_sha="$HEAD_SHA" \
            -f status="in_progress" \
            --jq '.id')
          echo "New check ID: $NEW_CHECK_ID"

          # Simulate some work (optional)
          sleep 2

          echo "=== Step 4: Complete the new check as SUCCESS ==="
          gh api -X PATCH /repos/$REPO/check-runs/$NEW_CHECK_ID \
            -f status="completed" -f conclusion="success" --silent

          echo "All done. PR status should now show SUCCESS."