name: Manage GitHub Checks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"

jobs:
  manage_checks:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Handle checks based on event type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          CHECK_NAME="E2E (Internal & Prod)"
          REPO="${{ github.repository }}"
          API_URL="https://api.github.com/repos/${REPO}"

          # ----- Helper function: cancel all checks with this name on all PR commits -----
          cancel_all_checks() {
            echo "Cancelling all existing checks named '$CHECK_NAME'..."
            COMMITS=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "${API_URL}/pulls/${PR_NUMBER}/commits" | jq -r '.[].sha')
            for SHA in $COMMITS; do
              CHECK_RUNS=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "${API_URL}/commits/${SHA}/check-runs")
              STALE_IDS=$(echo "$CHECK_RUNS" | jq -r '.check_runs[] | select(.name=="'"$CHECK_NAME"'") | .id')
              if [ -n "$STALE_IDS" ]; then
                for CID in $STALE_IDS; do
                  echo "Cancelling check $CID on commit $SHA"
                  curl -sS -X PATCH \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    -H "Content-Type: application/json" \
                    -d '{"status":"completed","conclusion":"cancelled"}' \
                    "${API_URL}/check-runs/${CID}" > /dev/null
                done
              fi
            done
          }

          # ----- Helper function: create a final success check on HEAD_SHA -----
          create_success_check() {
            echo "Creating final success check..."
            NEW_RESPONSE=$(curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$CHECK_NAME\",\"head_sha\":\"$HEAD_SHA\",\"status\":\"in_progress\"}" \
              "${API_URL}/check-runs")
            NEW_CHECK_ID=$(echo "$NEW_RESPONSE" | jq -r '.id')
            echo "New check ID: $NEW_CHECK_ID"
            sleep 2
            curl -sS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"status":"completed","conclusion":"success"}' \
              "${API_URL}/check-runs/${NEW_CHECK_ID}" > /dev/null
            echo "Success check created."
          }

          # ----- Main logic based on event type -----
          if [ "$EVENT_NAME" == "edited" ]; then
            echo "Event: edited – cancelling all stale checks and creating a success check."
            cancel_all_checks
            sleep 2
            create_success_check
          else
            echo "Event: $EVENT_NAME – creating 5 in-progress checks, waiting, then cancelling and creating final success."
            # Create 5 checks
            for i in {1..5}; do
              echo "Creating check run #$i..."
              RESPONSE=$(curl -sS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"$CHECK_NAME\",\"head_sha\":\"$HEAD_SHA\",\"status\":\"in_progress\"}" \
                "${API_URL}/check-runs")
              CHECK_ID=$(echo "$RESPONSE" | jq -r '.id')
              echo "Check run #$i created with ID: $CHECK_ID"
            done
            echo "Waiting 30 seconds to observe in-progress state..."
            sleep 30
            cancel_all_checks
            sleep 2
            create_success_check
          fi

          echo "All done. PR status should now show SUCCESS."