name: Manage GitHub Checks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  create_checks:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    outputs:
      last_check_id: ${{ steps.check_creator.outputs.last_id }}
    steps:
      - name: Create 5 Checks and Save Last ID
        id: check_creator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CHECK_NAME="E2E (Internal & Prod)"
          STATUS="in_progress"
          
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Target Commit SHA: $HEAD_SHA"
          
          LAST_ID=""
          for i in {1..5}; do
            echo "Creating check run #$i..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/check-runs" \
              -d "{\"name\":\"$CHECK_NAME\",\"head_sha\":\"$HEAD_SHA\",\"status\":\"$STATUS\"}")
            
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP Status: $HTTP_STATUS"
            echo "Response: $BODY"
            
            if [ "$HTTP_STATUS" -ne 201 ]; then
              echo "Error: Failed to create check run. HTTP $HTTP_STATUS"
              exit 1
            fi
            
            CHECK_ID=$(echo "$BODY" | jq -r '.id')
            echo "Check run #$i created with ID: $CHECK_ID"
            LAST_ID="$CHECK_ID"
          done
          
          if [ -z "$LAST_ID" ] || [ "$LAST_ID" = "null" ]; then
            echo "Error: No valid check ID created."
            exit 1
          fi
          
          echo "last_id=$LAST_ID" >> "$GITHUB_OUTPUT"

  update_all:
    runs-on: ubuntu-latest
    needs: create_checks
    # 👇 Ensure this job runs even if create_checks fails
    if: always()
    permissions:
      checks: write
    steps:
      - name: Update all pending checks to success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Fetching check runs for commit $HEAD_SHA"
          RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs")
          
          # Extract IDs of checks with the specific name and status 'in_progress' or 'queued'
          CHECK_IDS=$(echo "$RESPONSE" | jq -r '.check_runs[] | select(.name=="E2E (Internal & Prod)" and (.status=="in_progress" or .status=="queued")) | .id')
          
          if [ -z "$CHECK_IDS" ]; then
            echo "No in-progress/queued checks found to update."
            exit 0
          fi
          
          for CHECK_ID in $CHECK_IDS; do
            echo "Updating check $CHECK_ID to completed/success..."
            curl -s -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/check-runs/$CHECK_ID" \
              -d '{"status":"completed","conclusion":"success"}'
          done