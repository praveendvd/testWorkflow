name: Manage GitHub Checks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"
  issue_comment:
    types: [created]

jobs:
  create_checks:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    outputs:
      last_check_id: ${{ steps.check_creator.outputs.last_id }}
    steps:
      - name: Create 5 Checks and Save Last ID
        id: check_creator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CHECK_NAME="E2E (Internal & Prod)"
          STATUS="in_progress"

          # Use the PR head SHA if available, otherwise the commit that triggered the workflow
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Target Commit SHA: $HEAD_SHA"

          # Ensure we have a valid SHA
          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            echo "ERROR: HEAD_SHA is empty or null"
            exit 1
          fi

          LAST_ID=""
          for i in {1..5}; do
            echo "Creating check run #$i..."
            # Use gh CLI for simpler API calls with automatic auth
            CHECK_ID=$(gh api \
              -X POST /repos/${{ github.repository }}/check-runs \
              -f name="$CHECK_NAME" \
              -f head_sha="$HEAD_SHA" \
              -f status="$STATUS" \
              --jq '.id')

            if [ -z "$CHECK_ID" ] || [ "$CHECK_ID" = "null" ]; then
              echo "ERROR: Failed to create check run #$i"
              exit 1
            fi

            echo "Check run #$i created with ID: $CHECK_ID"
            LAST_ID="$CHECK_ID"
          done

          echo "last_id=$LAST_ID" >> "$GITHUB_OUTPUT"

  update_all:
    runs-on: ubuntu-latest
    needs: create_checks
    # Only run this job if check creation succeeded
    if: always() && needs.create_checks.result == 'success'
    permissions:
      checks: write
    steps:
      - name: Update all pending checks to success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Fetching check runs for commit $HEAD_SHA"
          # List all check runs for the commit
          CHECK_IDS=$(gh api /repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs \
            --jq '.check_runs[] | select(.name=="E2E (Internal & Prod)" and (.status=="in_progress" or .status=="queued")) | .id')

          if [ -z "$CHECK_IDS" ]; then
            echo "No in-progress/queued checks found to update."
            exit 0
          fi

          for CHECK_ID in $CHECK_IDS; do
            echo "Updating check $CHECK_ID to completed/success..."
            gh api -X PATCH /repos/${{ github.repository }}/check-runs/$CHECK_ID \
              -f status="completed" \
              -f conclusion="success" \
              --silent
          done
          echo "All pending checks updated."