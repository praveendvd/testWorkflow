name: Manage GitHub Checks

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
      - rc-sas
      - "release/**"

jobs:
  create_check:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    outputs:
      check_run_id: ${{ steps.create.outputs.check_run_id }}
      target_sha: ${{ steps.resolve_sha.outputs.target_sha }}

    steps:
      - name: Resolve target SHA (merge preview, else head)
        id: resolve_sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha || '' }}"
          PR_NUMBER="${{ github.event.pull_request.number || '' }}"

          if [ -n "$MERGE_SHA" ] && [ "$MERGE_SHA" != "null" ]; then
            echo "target_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$PR_NUMBER" ]; then
            for i in $(seq 1 10); do
              sleep 3
              FETCHED=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API/pulls/$PR_NUMBER" | jq -r '.merge_commit_sha')
              if [ -n "$FETCHED" ] && [ "$FETCHED" != "null" ]; then
                echo "target_sha=$FETCHED" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          fi

          echo "target_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Create E2E check (in progress)
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.resolve_sha.outputs.target_sha }}
        run: |
          set -euo pipefail
          CHECK_NAME="E2E (Internal & Prod)"
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs" \
            -d "{\"name\":\"$CHECK_NAME\",\"head_sha\":\"$TARGET_SHA\",\"status\":\"in_progress\"}")

          CHECK_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ -z "$CHECK_ID" ] || [ "$CHECK_ID" = "null" ]; then
            echo "Create failed: $RESPONSE"
            exit 1
          fi
          echo "check_run_id=$CHECK_ID" >> "$GITHUB_OUTPUT"

  complete_check:
    runs-on: ubuntu-latest
    needs: create_check
    if: always() && needs.create_check.result == 'success'
    permissions:
      checks: write
    steps:
      - name: Mark E2E check success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ID: ${{ needs.create_check.outputs.check_run_id }}
        run: |
          set -euo pipefail
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs/$CHECK_ID" \
            -d '{"status":"completed","conclusion":"success"}'